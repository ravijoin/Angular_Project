<mat-toolbar color="primary">
  <span>Equality Healthcare</span>
  <span class="spacer"></span>
  <mat-slide-toggle
    color="accent"
    [checked]="isDark"
    (change)="setTheme($event.checked)"
  >
    Dark Mode
  </mat-slide-toggle>

  <div class="user-info">
    @if (loggedIn) {
    <div class="name">Hi, Naman Jain</div>
    }
    <button mat-raised-button color="warn" (click)="logout()">Log Out</button>
  </div>
</mat-toolbar>
