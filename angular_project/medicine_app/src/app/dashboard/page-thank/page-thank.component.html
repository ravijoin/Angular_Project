<div class="thank-you-container">
  <mat-card class="thank-you-card">
    <mat-card-header>
      <mat-card-title>Thank You!!</mat-card-title>
      <div class="checkmark-container">
        <img src="../../../assets/check_mark.png" alt="Checkmark" class="checkmark-image" />
      </div>
    </mat-card-header>
    <mat-card-content>
      <p><i>We appreciate your effort and contribution. Your action was successful!</i></p>

    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-raised-button color="primary" (click)="goToHome()">Go to Home</button>
    </mat-card-actions>
  </mat-card>
</div>
